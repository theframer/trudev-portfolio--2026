<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <title>You’re offline | TRUDEV</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; background: #080808; color: #f4f3ef; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 760px); border: 1px solid #292929; padding: clamp(24px, 7vw, 64px); }
      a { color: inherit; text-decoration: none; }
      .brand { display: inline-block; border: 1px solid #343434; padding: 13px 16px; font-size: 10px; font-weight: 800; letter-spacing: .14em; }
      .eyebrow { margin: 64px 0 16px; color: #ff3b2f; font-size: 10px; font-weight: 700; letter-spacing: .18em; }
      h1 { max-width: 650px; margin: 0; font-size: clamp(52px, 12vw, 104px); line-height: .84; letter-spacing: -.08em; }
      p { max-width: 430px; margin: 24px 0 32px; color: #aaa69e; font-size: 15px; line-height: 1.7; }
      button { min-height: 48px; padding: 0 18px; border: 1px solid #ff3b2f; background: #ff3b2f; color: #080808; font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; }
      button:focus-visible, a:focus-visible { outline: 2px solid #ff3b2f; outline-offset: 4px; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">TRUDEV</a>
      <p class="eyebrow">CONNECTION INTERRUPTED</p>
      <h1>YOU’RE<br />OFFLINE.</h1>
      <p>The internet connection is unavailable right now. Your PDF files stay on your device. Reconnect and try again when you’re ready.</p>
      <button type="button" onclick="location.reload()">Try again <span aria-hidden="true">↗︎</span></button>
    </main>
    <script>window.addEventListener("online", () => location.reload());</script>
  </body>
</html>
